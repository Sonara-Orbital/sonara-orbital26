<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="400" fill="#f3f4f6" />
  
  <!-- Outer Border / Card Outline -->
  <rect x="20" y="20" width="360" height="360" rx="16" fill="#e5e7eb" stroke="#d1d5db" stroke-width="4" />
  
  <!-- Vinyl / Music Icon Group -->
  <g transform="translate(200, 160)">
    <!-- Vinyl Record Outer Ring -->
    <circle cx="0" cy="0" r="70" fill="#374151" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#4b5563" stroke-width="1" />
    <!-- Record Label Center -->
    <circle cx="0" cy="0" r="22" fill="#ef4444" />
    <!-- Center Hole -->
    <circle cx="0" cy="0" r="6" fill="#f3f4f6" />
  </g>

  <!-- Text: Album Cover Not Available -->
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#4b5563" text-anchor="middle">
    Album Cover Not Found
  </text>
</svg>
